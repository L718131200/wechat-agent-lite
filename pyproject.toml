[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent-lite"
version = "0.1.0"
description = "微信 AI 机器人的业务层：只管监听、触发判定、上下文、模型调用、图片识别与分段发送；收发和 UI 操作交给 wechatauto-replica 引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "wechat-agent-lite contributors" }]
keywords = ["wechat", "agent", "llm", "rpa", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
]
dependencies = [
  # 引擎：负责收发消息、下载图片、操作微信窗口（Apache-2.0）
  "wechatauto-replica>=1.2.6.1",
  "PyYAML>=6.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wechat-agent = "wechat_agent.main:main"

[project.urls]
Homepage = "https://github.com/L718131200/wechat-agent-lite"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_agent = ["py.typed"]
